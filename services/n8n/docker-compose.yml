# 컨테이너 로그(표준 출력) 크기 제한
# - 파일당 10MB, 최대 5개 (컨테이너당 약 50MB)
# - 넘으면 오래된 파일부터 삭제
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    # PostgreSQL 17: n8n 2.44.7 기준 지원 범위가 17 이상 (16 은 호환 모드 경고)
    image: postgres:17-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    logging: *default-logging
    # 계정·DB 이름은 .env 의 POSTGRES_* 를 따름 (데이터 볼륨이 비어 있는 최초 기동 때만 적용)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    # 공식 n8n 이미지의 Node 만 교체한 로컬 이미지 (같은 폴더의 Dockerfile, 이유·되돌릴 조건도 거기)
    # - 버전은 .env 의 N8N_VERSION·N8N_NODE_VERSION 으로 고정
    # - pull_policy never: 레지스트리에서 받지 않고, 이 태그가 없을 때만 빌드
    # - 매번 빌드하지 않는 이유: 빌드마다 이미지 ID 가 바뀌어 start 만 해도 컨테이너가 재생성됨
    # - bin/n8n.sh restart 는 내리기 전에 항상 다시 빌드 (Dockerfile 수정 반영)
    image: n8n-local:${N8N_VERSION:?set N8N_VERSION in .env}-node${N8N_NODE_VERSION:?set N8N_NODE_VERSION in .env}
    pull_policy: never
    build:
      args: [N8N_VERSION, N8N_NODE_VERSION]
    container_name: n8n
    restart: unless-stopped
    logging: *default-logging
    # 호스트·컨테이너 포트 모두 .env 의 N8N_PORT 를 따름
    ports:
      - "${N8N_PORT:-5678}:${N8N_PORT:-5678}"
    # n8n 설정은 같은 폴더의 .env 한 곳에서 관리
    env_file:
      - .env
    # DB 는 위 postgres 컨테이너 사용 (접속 정보는 .env 의 POSTGRES_* 를 그대로 연결)
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
      # 백업 폴더 전체 연결
      # - 호스트 <BACKUP_DIR> = 컨테이너 ~/.n8n-files/backups
      # - 전체 연결 이유: 백업 워크플로우도 bin/n8n.sh backup 과 같은 경로에 저장
      # - BACKUP_DIR 은 .env 에서 지정, 비어 있으면 data/backups
      # - n8n 2.x 파일 노드는 ~/.n8n-files 아래만 접근 가능
      # - bin/n8n.sh backup 의 DB 덤프·볼륨 백업도 워크플로우에서 읽을 수 있음
      - ${BACKUP_DIR:-../../data/backups}:/home/node/.n8n-files/backups
      # 스티키 노트 로고: 편집기 static 폴더에 읽기 전용 연결 → 주소 /static/ajd-auto-logo.png
      # - n8n 스티키는 https:// 와 /static/ 아래 이미지만 표시
      # - n8n-editor-ui 링크를 거쳐 연결: pnpm 해시가 든 실제 경로가 n8n 버전마다 달라도 유지
      # - 이미지 크기는 파일 크기 그대로라 50x50 px 파일 사용
      - ../../assets/ajd-auto-logo.png:/usr/local/lib/node_modules/n8n/node_modules/n8n-editor-ui/dist/static/ajd-auto-logo.png:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  # 암호화 키(config)·커뮤니티 노드 등
  # - 워크플로우·크레덴셜은 n8n_postgres_data 에 저장
  n8n_data:
    name: n8n_data
  n8n_postgres_data:
    name: n8n_postgres_data
