services:
  postgres:
    # n8n 2.44.7 기준 지원 범위는 17 이상 (16 은 호환 모드 경고)
    image: postgres:17-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    # 계정·DB 이름은 .env 의 POSTGRES_* 를 따름 (데이터 볼륨이 비어 있는 최초 기동 때만 적용)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    # 버전은 .env 의 N8N_VERSION 으로 고정
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:?set N8N_VERSION in .env}
    container_name: n8n
    restart: unless-stopped
    # 호스트·컨테이너 포트 모두 .env 의 N8N_PORT 를 따름
    ports:
      - "${N8N_PORT:-5678}:${N8N_PORT:-5678}"
    # n8n 설정은 같은 폴더의 .env 한 곳에서 관리
    env_file:
      - .env
    # DB 는 위 postgres 컨테이너 사용 (접속 정보는 .env 의 POSTGRES_* 를 그대로 연결)
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  # 암호화 키(config)·커뮤니티 노드 등 (워크플로우·크레덴셜은 postgres 쪽)
  n8n_data:
    name: n8n_data
  n8n_postgres_data:
    name: n8n_postgres_data
